name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon 2>/dev/null || gradle assembleDebug --no-daemon

      - name: Run lint check
        run: ./gradlew lint --no-daemon 2>/dev/null || gradle lint --no-daemon
        continue-on-error: true

      - name: Run unit tests
        run: ./gradlew test --no-daemon 2>/dev/null || gradle test --no-daemon
        continue-on-error: true
